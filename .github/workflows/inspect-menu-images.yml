name: Inspect menu images

on:
  push:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build contact sheets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw, ImageFont

          src = Path('public/images/menu')
          out = Path('artifacts/contact-sheets')
          out.mkdir(parents=True, exist_ok=True)
          files = sorted(src.glob('*.jpg'))
          thumb_w, thumb_h = 240, 200
          cols = 5
          rows = 6
          per_sheet = cols * rows
          try:
              font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 14)
          except Exception:
              font = ImageFont.load_default()

          for sheet_index in range(0, len(files), per_sheet):
              batch = files[sheet_index:sheet_index + per_sheet]
              sheet_no = sheet_index // per_sheet + 1
              canvas = Image.new('RGB', (cols * thumb_w, rows * thumb_h), 'white')
              draw = ImageDraw.Draw(canvas)

              for i, path in enumerate(batch):
                  try:
                      with Image.open(path) as im:
                          im = im.convert('RGB')
                          im.thumbnail((thumb_w - 12, thumb_h - 40), Image.Resampling.LANCZOS)
                          tile = Image.new('RGB', (thumb_w, thumb_h), '#eeeeee')
                          x = (thumb_w - im.width) // 2
                          y = 6
                          tile.paste(im, (x, y))
                          td = ImageDraw.Draw(tile)
                          td.rectangle((0, thumb_h - 30, thumb_w, thumb_h), fill='white')
                          td.text((6, thumb_h - 24), path.name, fill='black', font=font)
                          cx = (i % cols) * thumb_w
                          cy = (i // cols) * thumb_h
                          canvas.paste(tile, (cx, cy))
                  except Exception as exc:
                      cx = (i % cols) * thumb_w
                      cy = (i // cols) * thumb_h
                      draw.text((cx + 8, cy + 8), f'ERROR: {path.name}', fill='red', font=font)
                      draw.text((cx + 8, cy + 30), str(exc)[:100], fill='red', font=font)

              canvas.save(out / f'menu-contact-{sheet_no:02d}.jpg', quality=88)

          (Path('artifacts') / 'image-list.txt').write_text('\n'.join(p.name for p in files), encoding='utf-8')
          PY
      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: menu-image-inspection
          path: artifacts/
          if-no-files-found: error
